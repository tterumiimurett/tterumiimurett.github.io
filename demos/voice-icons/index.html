<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>朗读图标对比 · J-Space</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{background:#f5f6ed;color:#283c29;font:16px/1.7 system-ui,sans-serif;margin:0;padding:55px 24px}main{max-width:800px;margin:auto}h1{font-size:28px;font-weight:500}p{color:#687560}section{border:1px solid #d8dfcf;background:#fafcf5;border-radius:25px;padding:28px;margin:24px 0}h2{font-size:18px;font-weight:500;margin:0 0 16px}.samples{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.samples button{border:0;background:#e9ede5;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer}.samples button:hover{background:#dce5d6}.samples .voice-silhouette{width:26px;height:32px}a{color:#536b78;text-underline-offset:5px;font-size:14px}.hint{font-size:13px;margin:14px 0 0}button:focus-visible,a:focus-visible{outline:2px solid #328e41;outline-offset:4px}
</style></head><body><main><a href="/blog/anthropic-j-space/">← 返回文章</a><h1>两组朗读图标</h1><p>根据你提供的两组人形轮廓绘制。点击图标切换男声 / 女声外观。</p><section><h2>版本一 · 橄榄绿与米杏色</h2><div class="samples" data-variant="organic"><button aria-label="male" data-gender="male"></button><button aria-label="female" data-gender="female"></button><a href="/blog/anthropic-j-space/?voice-icons=organic">在正文里试用 ↗</a></div></section><section><h2>版本二 · 灰蓝与柔粉色（正式版）</h2><div class="samples" data-variant="rounded"><button aria-label="male" data-gender="male"></button><button aria-label="female" data-gender="female"></button><a href="/blog/anthropic-j-space/?voice-icons=rounded">在正文里试用 ↗</a></div></section><p class="hint">对比页只切换图标；进入正文后，图标会切换实际朗读音色。</p></main><script type="module">
import {voiceIcon} from '/assets/blog/voice-icons-v1.js';
for(const button of document.querySelectorAll('.samples button')){
 const variant=button.closest('[data-variant]').dataset.variant;
 function render(){button.innerHTML=voiceIcon(button.dataset.gender,variant);button.setAttribute('aria-label',button.dataset.gender)}
 render();button.addEventListener('click',()=>{button.dataset.gender=button.dataset.gender==='male'?'female':'male';render()});
}
</script></body></html>
